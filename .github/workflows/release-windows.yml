name: Release Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out merged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: node scripts/release-status.cjs

      - name: Use the original tagged source when retrying a release
        if: steps.version.outputs.should_release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.source_ref }}

      - name: Set up Node.js
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.version.outputs.should_release == 'true'
        run: npm ci

      - name: Run tests
        if: steps.version.outputs.should_release == 'true'
        run: npm test

      - name: Run lint
        if: steps.version.outputs.should_release == 'true'
        run: npm run lint

      - name: Build Windows installer and portable app
        if: steps.version.outputs.should_release == 'true'
        run: npm run package:windows

      - name: Publish tag and GitHub release
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_EXISTS: ${{ steps.version.outputs.release_exists }}
        run: |
          if ($env:RELEASE_EXISTS -ne 'true') {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "Trading Journal $env:RELEASE_VERSION" --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:RELEASE_TAG "release/Trading-Journal-Setup-$env:RELEASE_VERSION-x64.exe" "release/Trading-Journal-Portable-$env:RELEASE_VERSION-x64.exe" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --latest
