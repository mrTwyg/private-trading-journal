name: Release Windows app

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out merged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and check for an existing release
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch --tags --force
          git rev-parse --verify --quiet "refs/tags/$tag"
          $exists = $LASTEXITCODE -eq 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "should_release=$(!$exists)" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        if: steps.version.outputs.should_release == 'True'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.version.outputs.should_release == 'True'
        run: npm ci

      - name: Run tests
        if: steps.version.outputs.should_release == 'True'
        run: npm test

      - name: Run lint
        if: steps.version.outputs.should_release == 'True'
        run: npm run lint

      - name: Build Windows installer and portable app
        if: steps.version.outputs.should_release == 'True'
        run: npm run package:windows

      - name: Publish tag and GitHub release
        if: steps.version.outputs.should_release == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:RELEASE_TAG `
            "release/Trading-Journal-Setup-$env:RELEASE_VERSION-x64.exe" `
            "release/Trading-Journal-Portable-$env:RELEASE_VERSION-x64.exe" `
            --target $env:GITHUB_SHA `
            --title "Trading Journal $env:RELEASE_VERSION" `
            --generate-notes `
            --latest
